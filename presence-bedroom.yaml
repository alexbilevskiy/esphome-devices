esphome:
  name: esp32-c3-01
  friendly_name: presence-bedroom
  platformio_options:
    board_build.flash_mode: dio
    build_flags:
      - -std=gnu++17
    build_unflags:
      - -std=gnu++11

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y

logger:
  baud_rate: 0

esp32_ble_tracker:


api:
ota:
  platform: esphome

safe_mode:
  disabled: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  power_save_mode: none
  # output_power: 8.5dbm

udp:
packet_transport:
  platform: udp
  update_interval: 60s # thats for a full batch. individual sensors are sent with their own update_interval
  sensors:
    - id: bh1750_lux
      broadcast_id: bh1750_lux

i2c:
  sda: GPIO2
  scl: GPIO1
  scan: false

status_led:
  pin:
    number: GPIO8
    inverted: true

uart:
  - rx_pin:
      number: GPIO4
      mode: INPUT_PULLDOWN
    tx_pin:
      number: GPIO3
      mode: OUTPUT
    baud_rate: 115200
    id: ld2410_uart

ld2410:
  uart_id: ld2410_uart
  id: ld2410_1

binary_sensor:
  - platform: ld2410
    ld2410_id: ld2410_1
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target
    out_pin_presence_status:
      name: out pin presence status

sensor:
  # raw, fast, not exposed to HA (nameless) — feeds packet_transport at 1s
  - platform: bh1750
    internal: true
    id: bh1750_lux
    address: 0x23
    update_interval: 1s
  # HA-visible: publish on >= 1 lux change (immediate) or 60s heartbeat
  - platform: copy
    source_id: bh1750_lux
    name: "BH1750 Illuminance"
    filters:
      - or:
          - delta: 1
          - heartbeat: 60s

  - platform: ld2410
    ld2410_id: ld2410_1
    moving_distance:
      name: "Moving distance (cm)"
    still_distance:
      name: "Still Distance (cm)"
    moving_energy:
      name: "Move Energy (%)"
    still_energy:
      name: "Still Energy (%)"
    detection_distance:
      name: "Distance Detection (cm)"
    g0:
      move_energy:
        name: g0 move energy
      still_energy:
        name: g0 still energy
    g1:
      move_energy:
        name: g1 move energy
      still_energy:
        name: g1 still energy
    g2:
      move_energy:
        name: g2 move energy
      still_energy:
        name: g2 still energy
    g3:
      move_energy:
        name: g3 move energy
      still_energy:
        name: g3 still energy
    g4:
      move_energy:
        name: g4 move energy
      still_energy:
        name: g4 still energy
    g5:
      move_energy:
        name: g5 move energy
      still_energy:
        name: g5 still energy
    g6:
      move_energy:
        name: g6 move energy
      still_energy:
        name: g6 still energy
    g7:
      move_energy:
        name: g7 move energy
      still_energy:
        name: g7 still energy
    g8:
      move_energy:
        name: g8 move energy
      still_energy:
        name: g8 still energy
    light:
      name: light
  - platform: uptime
    name: Uptime
  - platform: internal_temperature
    name: "Internal Temperature"

switch:
  - platform: ld2410
    ld2410_id: ld2410_1
    engineering_mode:
      name: "engineering mode"
    bluetooth:
      name: "control bluetooth"


number:
  - platform: ld2410
    ld2410_id: ld2410_1
    timeout:
      name: timeout
    max_move_distance_gate:
      name: max move distance gate
    max_still_distance_gate:
      name: max still distance gate
    g0:
      move_threshold:
        name: g0 move threshold
      still_threshold:
        name: g0 still threshold
    g1:
      move_threshold:
        name: g1 move threshold
      still_threshold:
        name: g1 still threshold
    g2:
      move_threshold:
        name: g2 move threshold
      still_threshold:
        name: g2 still threshold
    g3:
      move_threshold:
        name: g3 move threshold
      still_threshold:
        name: g3 still threshold
    g4:
      move_threshold:
        name: g4 move threshold
      still_threshold:
        name: g4 still threshold
    g5:
      move_threshold:
        name: g5 move threshold
      still_threshold:
        name: g5 still threshold
    g6:
      move_threshold:
        name: g6 move threshold
      still_threshold:
        name: g6 still threshold
    g7:
      move_threshold:
        name: g7 move threshold
      still_threshold:
        name: g7 still threshold
    g8:
      move_threshold:
        name: g8 move threshold
      still_threshold:
        name: g8 still threshold
    light_threshold:
      name: light threshold



button:
  - platform: ld2410
    ld2410_id: ld2410_1
    factory_reset:
      name: "factory reset"
    restart:
      name: "restart ld2410"
    query_params:
      name: query params
  - platform: restart
    name: Restart
    entity_category: diagnostic

text_sensor:
  - platform: ld2410
    ld2410_id: ld2410_1
    version:
      name: "firmware version"
    mac_address:
      name: "mac address"


select:
  - platform: ld2410
    ld2410_id: ld2410_1
    distance_resolution:
      name: "distance resolution"
    baud_rate:
      name: "baud rate"
    light_function:
      name: light function
    out_pin_level:
      name: out pin level