esphome:
  name: esp32-s3-devboard
  friendly_name: esp32-s3-devboard

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [spwm]

logger:
  baud_rate: 115200

api:
ota:
  platform: esphome

safe_mode:
  disabled: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  power_save_mode: none
  output_power: 8.5dbm

button:
  - platform: restart
    name: "Reboot"

display:
  - platform: spwm
    id: matrix
    panel_width: 128
    panel_height: 64
    scan_rows: 32
    r1_pin: GPIO4
    g1_pin: GPIO1
    b1_pin: GPIO5
    r2_pin: GPIO6
    g2_pin: GPIO2
    b2_pin: GPIO7
    a_pin: GPIO15
    b_pin: GPIO41
    c_pin: GPIO16
    d_pin: GPIO40
    e_pin: GPIO42
    lat_pin: GPIO39
    oe_pin: GPIO18
    clk_pin: GPIO17
    update_interval: 500ms
    lambda: |-
      auto red = Color(255, 0, 0);
      auto green = Color(0, 255, 0);
      auto blue = Color(0, 0, 255);
      it.fill(Color::BLACK);
      it.rectangle(0, 0, it.get_width(), it.get_height(), red);
      it.line(0, 0, it.get_width(), it.get_height(), green);
      it.line(0, it.get_height(), it.get_width(), 0, blue);

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: "WiFi Signal Sensor"

output:
  - id: indicator_output_tx
    platform: gpio
    pin:
      number: GPIO43
    inverted: true
  # - id: indicator_output_rx
  #   platform: gpio
  #   pin:
  #     number: GPIO44
  #   inverted: true

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: ws2812
    pin: GPIO48
    num_leds: 6
    name: "RGB Led"
    default_transition_length: 0s
    rmt_symbols: 48
    use_dma: false
    use_psram: false

  - platform: binary
    id: indicator_light_tx
    name: "Indicator TX"
    output: indicator_output_tx
    restore_mode: ALWAYS_OFF

  # - platform: binary
  #   id: indicator_light_rx
  #   name: "Indicator RX"
  #   output: indicator_output_rx
  #   restore_mode: ALWAYS_ON

status_led:
  pin:
    number: GPIO44
    inverted: true
