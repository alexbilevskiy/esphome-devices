esphome:
  name: esp32-hub75
  friendly_name: esp32-hub75

esp32:
  board: lolin_s2_mini
  variant: esp32s2
  framework:
    type: arduino

substitutions:
  panel_width: "64"
  panel_height: "32"

external_components:
  - source:
      type: local
      path: components
    components: [weather_station]

logger:

api:
ota:
  platform: esphome

safe_mode:
  disabled: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false

time:
  - platform: sntp
    id: esptime
    timezone: Europe/Moscow

font:
  - file: "fonts/4x6.bdf"
    id: f4x6
    size: 6

color:
  - id: color_clock
    red: 100%
    green: 100%
    blue: 100%

weather_station:
  id: ws
  panel_width: ${panel_width}
  panel_height: ${panel_height}

display:
  - platform: hub75
    id: matrix
    panel_width: ${panel_width}
    panel_height: ${panel_height}
    brightness: 30
    update_interval: never
    auto_clear_enabled: false
    double_buffer: false
    r1_pin: GPIO40
    g1_pin: GPIO39
    b1_pin: GPIO38
    r2_pin: GPIO37
    g2_pin: GPIO36
    b2_pin: GPIO35
    a_pin: GPIO34
    b_pin: GPIO33
    c_pin: GPIO21
    d_pin: GPIO18
    lat_pin: GPIO16
    oe_pin: GPIO15
    clk_pin: GPIO17

lvgl:
  id: lvgl_ui
  displays: [matrix]
  buffer_size: 25%
  bg_color: black
  pages:
    - id: main_page
      widgets:
        - label:
            id: clock_label
            x: 1
            y: 0
            text_font: f4x6
            text_color: color_clock
            text:
              time_format: "%H:%M"
              time: esptime
        - canvas:
            id: particle_canvas
            x: 0
            y: 0
            width: ${panel_width}
            height: ${panel_height}
            transparent: true
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0

interval:
  - interval: 1s
    then:
      - lvgl.widget.refresh: clock_label
  - interval: 50ms
    then:
      - lvgl.canvas.fill:
          id: particle_canvas
          color: black
          opa: TRANSP
      - lambda: |-
          const auto &pixels = id(ws).get_pixels();
          for (const auto &p : pixels) {
            if (p.x < 0 || p.x >= ${panel_width} || p.y < 0 || p.y >= ${panel_height})
              continue;
            lv_color_t c = lv_color_make(p.r, p.g, p.b);
            lv_canvas_set_px(id(particle_canvas), p.x, p.y, c, LV_OPA_COVER);
          }

select:
  - platform: template
    name: "Simulate precipitation"
    id: sim_precip
    options:
      - ""
      - "snow"
      - "rain"
      - "wet_snow"
    initial_option: "rain"
    optimistic: true
    on_value:
      then:
        - lambda: id(ws).set_simulate_precip(x);

number:
  - platform: template
    name: "Simulated precip strength"
    id: sim_precip_strength
    min_value: 0.0
    max_value: 2.0
    step: 0.5
    initial_value: 1.0
    optimistic: true
    on_value:
      then:
        - lambda: id(ws).set_simulate_precip_strength(x);

  - platform: template
    name: "Simulated wind speed"
    id: sim_wind_speed
    min_value: 0.0
    max_value: 30.0
    step: 1.0
    initial_value: 0
    optimistic: true
    on_value:
      then:
        - lambda: id(ws).set_simulate_wind_speed(x);

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: Uptime
