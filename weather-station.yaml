weather_station:
  id: ws
  panel_width: ${panel_width}
  panel_height: ${panel_height}

display:
  - platform: hub75
    id: matrix
    panel_width: ${panel_width}
    panel_height: ${panel_height}
    brightness: 30
    update_interval: never
    auto_clear_enabled: false
    double_buffer: false
    r1_pin: GPIO4
    g1_pin: GPIO1
    b1_pin: GPIO5
    r2_pin: GPIO6
    g2_pin: GPIO2
    b2_pin: GPIO7
    a_pin: GPIO15
    b_pin: GPIO41
    c_pin: GPIO16
    d_pin: GPIO40
    e_pin: GPIO42
    lat_pin: GPIO39
    oe_pin: GPIO18
    clk_pin: GPIO17

lvgl:
  id: lvgl_ui
  displays: [matrix]
  buffer_size: 25%
  bg_color: black
  pages:
    - id: main_page
      widgets:
        - label:
            id: clock_label
            x: 1
            y: -4
            text_font: font_clock
            text_color: color_clock
            text:
              time_format: "%H:%M"
              time: esptime
        - label:
            id: date_label
            x: 1
            y: 20
            text_font: font_reg
            text_color: color_date
            text:
              time_format: "%a %d %b"
              time: esptime
        - label:
            id: temp_inside_label
            x: -1
            y: 0
            align: TOP_RIGHT
            text_font: font_reg
            text_color: color_temp_inside
            text: !lambda |-
              if (id(temp_inside).has_state() && !isnan(id(temp_inside).state))
                return str_sprintf("%.1f°", id(temp_inside).state);
              return std::string("N/A");
        - label:
            id: temp_outside_label
            x: -1
            y: 10
            align: TOP_RIGHT
            text_font: font_reg
            text_color: color_temp_outside
            text: !lambda |-
              int sec = id(esptime).now().second;
              if (sec % 10 >= 5) {
                if (id(temp_outside_measured).has_state() && !isnan(id(temp_outside_measured).state))
                  return str_sprintf("%d°", (int) round(id(temp_outside_measured).state));
              } else {
                if (id(temp_outside_provided).has_state()) {
                  float v = strtof(id(temp_outside_provided).state.c_str(), nullptr);
                  return str_sprintf("%d°", (int) round(v));
                }
              }
              return std::string("N/A");
        - image:
            id: weather_icon
            x: -16
            y: 12
            align: TOP_RIGHT
            src:
              mapping: icon_map
              value: !lambda return id(current_icon).state;
        - label:
            id: co2_label
            x: 1
            y: 40
            text_font: font_reg
            text_color: color_co2
            text: !lambda |-
              if (id(co2).has_state() && !isnan(id(co2).state))
                return str_sprintf("%dppm", (int) id(co2).state);
              return std::string("N/A");
        - label:
            id: humidity_label
            x: 1
            y: 30
            text_font: font_reg
            text_color: color_humidity
            text: !lambda |-
              if (id(humidity).has_state() && !isnan(id(humidity).state))
                return str_sprintf("%d%%", (int) round(id(humidity).state));
              return std::string("N/A");
        - label:
            id: wind_label
            x: -1
            y: 40
            align: TOP_RIGHT
            text_font: font_reg
            text_color: color_wind
            text: !lambda |-
              if (!id(wind_bearing).has_state())
                return std::string("N/A");
              int bearing = (int) strtol(id(wind_bearing).state.c_str(), nullptr, 10);
              const char *dir;
              switch (bearing) {
                case 0:   dir = "c"; break;
                case 45:  dir = "ne"; break;
                case 90:  dir = "e"; break;
                case 135: dir = "se"; break;
                case 180: dir = "s"; break;
                case 225: dir = "sw"; break;
                case 270: dir = "w"; break;
                case 315: dir = "nw"; break;
                case 360: dir = "n"; break;
                default:  dir = "?";
              }
              if (id(wind_speed_real).has_state() && !isnan(id(wind_speed_real).state))
                return str_sprintf("%s %dm/s", dir, (int) round(id(wind_speed_real).state));
              return std::string(dir);
        - image:
            id: forecast_icon_1
            x: -22
            y: 22
            align: TOP_RIGHT
            src:
              mapping: icon_map
              value: !lambda return id(forecast_icon_1_state).state;
        - label:
            id: forecast_label_1
            x: -1
            y: 20
            align: TOP_RIGHT
            text_font: font_reg
            text_color: color_forecast
            text: !lambda |-
              if (id(forecast_temp_1).has_state() && !isnan(id(forecast_temp_1).state) &&
                  id(forecast_period_1).has_state())
                return str_sprintf("%s%d°", id(forecast_period_1).state.c_str(),
                                   (int) round(id(forecast_temp_1).state));
              return std::string("N/A");
        - image:
            id: forecast_icon_2
            x: -22
            y: 32
            align: TOP_RIGHT
            src:
              mapping: icon_map
              value: !lambda return id(forecast_icon_2_state).state;
        - label:
            id: forecast_label_2
            x: -1
            y: 30
            align: TOP_RIGHT
            text_font: font_reg
            text_color: color_forecast
            text: !lambda |-
              if (id(forecast_temp_2).has_state() && !isnan(id(forecast_temp_2).state) &&
                  id(forecast_period_2).has_state())
                return str_sprintf("%s%d°", id(forecast_period_2).state.c_str(),
                                   (int) round(id(forecast_temp_2).state));
              return std::string("N/A");
        - label:
            id: custom_text_line1
            x: 1
            y: 49
            text_font: font_small
            text_color: color_date
            text: ""
        - label:
            id: custom_text_line2
            x: 1
            y: 54
            text_font: font_small
            text_color: color_date
            text: ""
        - canvas:
            id: particle_canvas
            x: 0
            y: 0
            width: ${panel_width}
            height: ${panel_height}
            transparent: true
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0

interval:
  - interval: 1s
    then:
      - lvgl.widget.refresh: clock_label
      - lvgl.widget.refresh: date_label
      - lvgl.widget.refresh: temp_outside_label
      - lambda: |-
          std::string text = id(custom_text_input).state;
          if (text.empty() || id(extra_dim_global)) {
            lv_label_set_text(id(custom_text_line1), "");
            lv_label_set_text(id(custom_text_line2), "");
            return;
          }
          const int max_chars = 25;
          int char_count = 0;
          for (size_t i = 0; i < text.length();) {
            uint8_t c = text[i];
            if (c < 0x80) i += 1;
            else if ((c & 0xE0) == 0xC0) i += 2;
            else if ((c & 0xF0) == 0xE0) i += 3;
            else if ((c & 0xF8) == 0xF0) i += 4;
            else i += 1;
            char_count++;
          }
          if (char_count <= max_chars) {
            lv_label_set_text(id(custom_text_line1), text.c_str());
            lv_label_set_text(id(custom_text_line2), "");
          } else {
            int char_idx = 0;
            int cut_byte = 0;
            int last_space_byte = 0;
            for (size_t i = 0; i < text.length() && char_idx <= max_chars;) {
              uint8_t c = text[i];
              size_t char_len;
              if (c < 0x80) char_len = 1;
              else if ((c & 0xE0) == 0xC0) char_len = 2;
              else if ((c & 0xF0) == 0xE0) char_len = 3;
              else if ((c & 0xF8) == 0xF0) char_len = 4;
              else char_len = 1;
              if (text[i] == ' ') last_space_byte = i;
              i += char_len;
              char_idx++;
              cut_byte = i;
            }
            int split_byte = last_space_byte > 0 ? last_space_byte : cut_byte;
            if (last_space_byte > 0) {
              lv_label_set_text(id(custom_text_line1), text.substr(0, split_byte).c_str());
              lv_label_set_text(id(custom_text_line2), text.substr(split_byte + 1).c_str());
            } else {
              lv_label_set_text(id(custom_text_line1), text.substr(0, split_byte).c_str());
              lv_label_set_text(id(custom_text_line2), text.substr(split_byte).c_str());
            }
          }
  - interval: 5s
    then:
      - lvgl.widget.refresh: weather_icon
      - lvgl.widget.refresh: temp_inside_label
      - lvgl.widget.refresh: co2_label
      - lvgl.widget.refresh: humidity_label
      - lvgl.widget.refresh: wind_label
      - lvgl.widget.refresh: forecast_icon_1
      - lvgl.widget.refresh: forecast_label_1
      - lvgl.widget.refresh: forecast_icon_2
      - lvgl.widget.refresh: forecast_label_2
  - interval: 50ms
    then:
      - lvgl.canvas.fill:
          id: particle_canvas
          color: black
          opa: TRANSP
      - lambda: |-
          const auto &pixels = id(ws).get_pixels();
          for (const auto &p : pixels) {
            if (p.x < 0 || p.x >= ${panel_width} || p.y < 0 || p.y >= ${panel_height})
              continue;
            lv_color_t c = lv_color_make(p.r, p.g, p.b);
            lv_canvas_set_px(id(particle_canvas), p.x, p.y, c, LV_OPA_COVER);
          }
  - interval: 30s
    then:
      - script.execute: update_brightness

output:
  - platform: template
    id: brightness_output
    type: float
    write_action:
      - script.execute: update_brightness
  - id: indicator_output_tx
    platform: gpio
    pin:
      number: GPIO43
    inverted: true
  # - id: indicator_output_rx
  #   platform: gpio
  #   pin:
  #     number: GPIO44
  #   inverted: true


light:
  - platform: monochromatic
    name: "Brightness"
    id: brightness_light
    output: brightness_output
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: ws2812
    pin: GPIO48
    num_leds: 1
    name: "RGB Led"
  # - platform: binary
  #   id: indicator_light_rx
  #   name: "Indicator RX"
  #   output: indicator_output_rx
  #   restore_mode: ALWAYS_ON
  - platform: binary
    id: indicator_light_tx
    name: "Indicator TX"
    output: indicator_output_tx
    restore_mode: ALWAYS_ON

script:
  - id: update_brightness
    then:
      - lambda: |-
          int hour = id(esptime).now().hour;
          int brightness = 0;
          bool extra_dim = false;

          auto *l = id(brightness_light);
          if (l->remote_values.is_on() && l->remote_values.get_brightness() > 0.0f) {
            brightness = (int) (l->remote_values.get_brightness() * 100.0f);
            if (brightness <= 1)
              extra_dim = true;
          } else {
            std::string sun = id(sun_state).has_state() ? id(sun_state).state : "";
            if (hour >= 0 && hour < 6) {
              if (sun == "below_horizon") { brightness = 1; extra_dim = true; }
              else brightness = 20;
            } else if (hour >= 6 && hour < 9) {
              brightness = (sun == "below_horizon") ? 20 : 50;
            } else if (hour >= 18 && hour < 22) {
              brightness = 25;
            } else if (hour >= 22) {
              brightness = 3;
            } else {
              brightness = 60;
            }
          }

          int brightness_255 = (int) (brightness * 2.55f);
          if (brightness_255 < 1) brightness_255 = 1;
          if (brightness_255 > 255) brightness_255 = 255;
          id(matrix).set_brightness(brightness_255);
          id(extra_dim_global) = extra_dim;

          if (extra_dim) {
            lv_obj_add_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(temp_inside_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(temp_outside_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(weather_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(co2_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(humidity_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(wind_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(forecast_label_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(forecast_icon_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(forecast_label_2), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(forecast_icon_2), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(temp_inside_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(temp_outside_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(weather_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(co2_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(humidity_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(wind_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(forecast_label_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(forecast_icon_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(forecast_label_2), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(forecast_icon_2), LV_OBJ_FLAG_HIDDEN);
          }

select:
  - platform: template
    name: "Simulate precipitation"
    id: sim_precip
    options:
      - ""
      - "snow"
      - "rain"
      - "wet_snow"
    initial_option: ""
    optimistic: true
    on_value:
      then:
        - lambda: id(ws).set_simulate_precip(x);

number:
  - platform: template
    name: "Simulated precip strength"
    id: sim_precip_strength
    min_value: 0.0
    max_value: 2.0
    step: 0.5
    initial_value: 1.0
    optimistic: true
    on_value:
      then:
        - lambda: id(ws).set_simulate_precip_strength(x);

  - platform: template
    name: "Simulated wind speed"
    id: sim_wind_speed
    min_value: 0.0
    max_value: 30.0
    step: 1.0
    initial_value: 0
    optimistic: true
    on_value:
      then:
        - lambda: id(ws).set_simulate_wind_speed(x);

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

text:
  - platform: template
    name: "Custom text"
    id: custom_text_input
    mode: text
    optimistic: true
    max_length: 150
    initial_value: ""
    restore_value: true

sensor:
  - platform: uptime
    name: Uptime
  - platform: homeassistant
    id: temp_inside
    entity_id: sensor.aqara_weather_02_temperature
  - platform: homeassistant
    id: temp_outside_measured
    entity_id: sensor.tuya_weather_02_temperature
  - platform: homeassistant
    id: co2
    entity_id: sensor.d1_co2_co2_scd30
  - platform: homeassistant
    id: humidity
    entity_id: sensor.aqara_weather_02_humidity
  - platform: homeassistant
    id: precip_type
    entity_id: sensor.precipitation_type
    on_value:
      then:
        - lambda: if (!isnan(x)) id(ws).set_precip_type((int) x);
  - platform: homeassistant
    id: precip_strength
    entity_id: sensor.precipitation_strength
    on_value:
      then:
        - lambda: if (!isnan(x)) id(ws).set_precip_strength(x);
  - platform: homeassistant
    id: wind_speed_real
    entity_id: sensor.wind_speed
    on_value:
      then:
        - lambda: if (!isnan(x)) id(ws).set_wind_speed_real((int) round(x));
  - platform: homeassistant
    id: forecast_temp_1
    entity_id: sensor.forecast_temp_1
  - platform: homeassistant
    id: forecast_temp_2
    entity_id: sensor.forecast_temp_2

text_sensor:
  - platform: homeassistant
    id: current_icon
    entity_id: sensor.fact_icon
  - platform: homeassistant
    id: temp_outside_provided
    entity_id: weather.yandex_weather
    attribute: temperature
  - platform: homeassistant
    id: wind_bearing
    entity_id: weather.yandex_weather
    attribute: wind_bearing
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
  - platform: homeassistant
    id: sun_rising
    entity_id: sun.sun
    attribute: next_rising
    on_value:
      then:
        - lambda: id(ws).set_sun_rising(x);
  - platform: homeassistant
    id: sun_setting
    entity_id: sun.sun
    attribute: next_setting
    on_value:
