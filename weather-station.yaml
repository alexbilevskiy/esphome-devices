esphome:
  name: weather-station
  friendly_name: weather-station

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

substitutions:
  panel_width: "128"
  panel_height: "64"

external_components:
  - source:
      type: local
      path: components
    components: [weather_station]

psram:
  mode: octal
  speed: 80MHz

logger:

api:
ota:
  platform: esphome

safe_mode:
  num_attempts: 5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  power_save_mode: none

globals:
  - id: extra_dim_global
    type: bool
    initial_value: 'false'

time:
  - platform: homeassistant
    id: esptime
    timezone: Europe/Moscow

font:
  - file: "fonts/win_crox5h.bdf"
    id: font_clock
    size: 18
  - file: "fonts/helvR08.bdf"
    id: font_reg
    size: 8
  - file: "fonts/b10.bdf"
    id: font_small
    size: 10
    glyphsets:
      - GF_Latin_Core
      - GF_Greek_Core
      - GF_Cyrillic_Core

color:
  - id: color_clock
    red: 100%
    green: 100%
    blue: 100%
  - id: color_date
    red: 31%
    green: 31%
    blue: 31%
  - id: color_temp_inside
    red: 1%
    green: 39%
    blue: 5%
  - id: color_temp_outside
