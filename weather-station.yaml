    green: 43%
    blue: 43%
  - id: color_temp_outside_provided
    red: 4%
    green: 24%
    blue: 24%
  - id: color_co2
    red: 31%
    green: 31%
    blue: 31%
  - id: color_humidity
    red: 31%
    green: 31%
    blue: 31%
  - id: color_wind
    red: 8%
    green: 24%
    blue: 43%
  - id: color_forecast
